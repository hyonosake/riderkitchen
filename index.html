<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rider Kitchen</title>
    <!-- Иконка вкладки «RK» (public/favicon.svg); PNG 180×180 — для
         «На экран Домой» в iOS, отрендерен из того же SVG. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <script>
      // Раннее применение сохранённых дебаг-вариантов (до монтирования
      // React), чтобы при перезагрузке не мигали дефолтные шрифты/цвета.
      // Списки синхронны с src/content/debugVariants.ts (дефолт — без атрибута).
      try {
        var debugVariants = [
          ['rk-fonts', 'data-fonts', ['b', 'g', 'h', 'i']],
          ['rk-palette', 'data-palette', ['peach', 'sage', 'backstage', 'espresso']],
        ]
        debugVariants.forEach(function (entry) {
          var saved = localStorage.getItem(entry[0])
          if (saved && entry[2].indexOf(saved) !== -1) {
            document.documentElement.setAttribute(entry[1], saved)
          }
        })
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Дефолтная пара B (Philosopher + Onest) плюс кандидаты F–I
         дебаг-переключалки. После выбора финальной пары лишние убрать. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Onest:wght@300;400;500;600;700&family=Philosopher:wght@400;700&family=Playfair+Display:wght@500;600;700&family=Rubik:wght@300;400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
