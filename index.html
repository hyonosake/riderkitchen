<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rider Kitchen — кейтеринг: питание команды и райдер артистов</title>
    <meta
      name="description"
      content="Кормим съёмочные группы, артистов по райдеру, команды фестивалей и мероприятий. Завтраки, супы, горячее, готовые сеты — готовим сами и привозим на площадку."
    />
    <meta name="theme-color" content="#ffe8db" />
    <!-- Стейджинг (shu.sentinam.io/riderkitchen/) — сайт ещё не заменил
         старый WordPress на riderkitchen.ru, поэтому закрыт от
         индексации. При переезде на прод убрать эту строку (см. также
         Disallow в public/robots.txt). -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Canonical/OG ниже намеренно указывают на финальный прод-домен
         riderkitchen.ru (корень, без /riderkitchen/) — а не на текущий
         сабраут стейджинга: это адрес, под которым сайт будет жить
         после переезда, а не то, где он сейчас развёрнут. -->
    <link rel="canonical" href="https://riderkitchen.ru/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rider Kitchen" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://riderkitchen.ru/" />
    <meta
      property="og:title"
      content="Rider Kitchen — кейтеринг: питание команды и райдер артистов"
    />
    <meta
      property="og:description"
      content="Кормим съёмочные группы, артистов по райдеру, команды фестивалей и мероприятий. Завтраки, супы, горячее, готовые сеты."
    />
    <meta property="og:image" content="https://riderkitchen.ru/og-image.webp" />
    <meta property="og:image:width" content="1680" />
    <meta property="og:image:height" content="994" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Rider Kitchen — кейтеринг: питание команды и райдер артистов"
    />
    <meta
      name="twitter:description"
      content="Кормим съёмочные группы, артистов по райдеру, команды фестивалей и мероприятий. Завтраки, супы, горячее, готовые сеты."
    />
    <meta name="twitter:image" content="https://riderkitchen.ru/og-image.webp" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CateringService",
        "name": "Rider Kitchen",
        "description": "Кейтеринг для съёмочных групп, артистов по райдеру, команд фестивалей и мероприятий: завтраки, супы, горячее, готовые сеты.",
        "url": "https://riderkitchen.ru/",
        "image": "https://riderkitchen.ru/og-image.webp",
        "telephone": "+79269101010",
        "sameAs": ["https://instagram.com/rider.kitchen"]
      }
    </script>
    <!-- Иконка вкладки «RK» (public/favicon.svg); PNG 180×180 — для
         «На экран Домой» в iOS, отрендерен из того же SVG. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <script>
      // Раннее применение сохранённых дебаг-вариантов (до монтирования
      // React), чтобы при перезагрузке не мигали дефолтные шрифты/цвета.
      // Списки синхронны с src/content/debugVariants.ts (дефолт — без атрибута).
      try {
        var debugVariants = [
          ['rk-fonts', 'data-fonts', ['b', 'g', 'h', 'i']],
          ['rk-palette', 'data-palette', ['peach', 'sage', 'backstage', 'espresso']],
          ['rk-mobile-layout', 'data-mobile-layout', ['list']],
        ]
        debugVariants.forEach(function (entry) {
          var saved = localStorage.getItem(entry[0])
          if (saved && entry[2].indexOf(saved) !== -1) {
            document.documentElement.setAttribute(entry[1], saved)
          }
        })
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Дефолтная пара B (Philosopher + Onest) плюс кандидаты F–I
         дебаг-переключалки. После выбора финальной пары лишние убрать. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Onest:wght@300;400;500;600;700&family=Philosopher:wght@400;700&family=Playfair+Display:wght@500;600;700&family=Rubik:wght@300;400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
